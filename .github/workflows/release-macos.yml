name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release app
        run: |
          DERIVED_DATA_PATH="$GITHUB_WORKSPACE/build/release"
          rm -rf "$DERIVED_DATA_PATH"
          mkdir -p "$DERIVED_DATA_PATH"
          xcodebuild \
            -project Tomato.xcodeproj \
            -scheme Tomato \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app bundle
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/release/Build/Products/Release/Tomato.app"
          VERSION="${GITHUB_REF_NAME}"
          ZIP_NAME="Tomato-${VERSION}-macOS.zip"

          test -d "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test Windows timer core
        shell: pwsh
        run: |
          dotnet test Tomato.WindowsCore.Tests/Tomato.WindowsCore.Tests.csproj -c Release

      - name: Build Windows GUI executable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $outDir = Join-Path $env:RUNNER_TEMP "TomatoWindowsPublish"
          dotnet publish Tomato.WindowsGui/Tomato.WindowsGui.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:EnableCompressionInSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:IncludeAllContentForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            -o $outDir

          $builtExe = Join-Path $outDir "Tomato.WindowsGui.exe"
          if (-not (Test-Path $builtExe)) {
            throw "Build succeeded but executable not found: $builtExe"
          }

          $releaseExe = Join-Path $outDir ("Tomato-" + $version + "-windows-x64.exe")
          Move-Item -Path $builtExe -Destination $releaseExe -Force
          "RELEASE_EXE=$releaseExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ env.RELEASE_EXE }}
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: Tomato ${{ github.ref_name }} (macOS + Windows)
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
